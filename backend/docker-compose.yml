# Local Azure Cosmos DB emulator (runs on Apple Silicon and x64).
#   Endpoint:      http://localhost:8081  (matches the default connection string in appsettings.json)
#   Data Explorer: http://localhost:1234
# Both are plain HTTP, so open them with http:// (https:// gives ERR_SSL_PROTOCOL_ERROR).
services:
  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: ipl-franchise-cosmosdb
    ports:
      - "8081:8081"
      - "1234:1234"
